<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus 15 anos</title>
    <link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    overflow-x:hidden;
    background:#061938;
}

.dresscode{
    position: relative;
    width: fit-content;
    margin: auto;
}

.dresscode img{
    width: 100%;
    max-width: 600px;
    display: block;
}

.btn-voltar{
    position: absolute;

    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);

    background: linear-gradient(45deg,#d4af37,#ffe38a);
    color:#071B3A;

    text-decoration:none;
    font-family:'Poppins',sans-serif;
    font-weight:600;

    padding:14px 28px;
    border-radius:40px;

    box-shadow:0 0 20px rgba(255,215,0,.6);

    transition:.3s;
}

.btn-voltar:hover{

    transform:translateX(-50%) scale(1.08);

    box-shadow:0 0 30px gold;

}

img{

    width:100vw;
    height:100vh;

    object-fit:cover;

}
    </style>
</head>
<body>
<div class="dresscode">

    <img src="imagens/trajes.png" alt="Dress Code">

    <a href="convite.html" class="btn-voltar">
        ⬅ Voltar ao convite
    </a>

</div>

</body>
</html>
